*{box-sizing:border-box}

a{color:inherit;text-decoration:none}

.wrap{width:100%;max-width:none;margin:0;padding:24px clamp(16px,4vw,64px) 56px}

.hd{display:flex;align-items:center;gap:14px;margin-bottom:18px}

.badge{display:inline-block;font-size:12px;font-weight:800;background:#d24726;color:#fff;border-radius:4px;padding:0 6px}

svg.dia text{fill:currentColor;font-family:inherit}

.content-title{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:19px;font-weight:800;color:#172b4d}

.yt-card:after{content:"▶";position:absolute;z-index:-1;right:5%;top:50%;transform:translateY(-50%) rotate(-8deg);font-size:clamp(100px,18vw,190px);font-weight:900;color:rgba(255,255,255,.075);line-height:1}
.yt-card:hover{transform:translateY(-3px);box-shadow:0 20px 38px rgba(19,35,65,.24)}
.yt-play{flex:0 0 76px;width:76px;height:76px;display:grid;place-items:center;border-radius:22px;background:#ff1838;box-shadow:0 8px 24px rgba(255,24,56,.32);font-size:34px;padding-left:4px}
.yt-copy{min-width:0;display:block}
.yt-kicker{display:inline-flex;align-items:center;gap:7px;margin-bottom:8px;color:#ffb8c1;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.yt-copy strong{display:block;font-size:clamp(18px,2.5vw,24px);line-height:1.25;letter-spacing:-.3px}
.yt-copy small{display:block;margin-top:8px;color:rgba(255,255,255,.78);font-size:13px;line-height:1.5}
.yt-action{display:inline-flex;align-items:center;gap:8px;margin-top:15px;padding:9px 15px;border-radius:999px;background:#fff;color:#c91832;font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.12)}
@media(max-width:560px){.yt-card{gap:15px;min-height:170px;padding:20px 17px}.yt-play{flex-basis:58px;width:58px;height:58px;border-radius:17px;font-size:26px}.yt-copy small{font-size:12px}}

.vid i{font-style:normal;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:26px}
.links{display:grid;gap:8px}
.links a{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.links a:hover{border-color:var(--c)}
.links small{display:block;color:var(--mut);word-break:break-all}
.sticky{position:relative;background:var(--note);color:var(--noteink);border-radius:4px 4px 4px 28px;padding:14px;transform:rotate(-.7deg);box-shadow:0 6px 14px rgba(0,0,0,.18)}
.sticky:before{content:"📌";position:absolute;top:-14px;left:50%;font-size:24px}
.sticky textarea{width:100%;min-height:150px;background:transparent;border:0;resize:vertical;font:600 16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;color:inherit;padding:6px 0 0}
.sticky textarea:focus-visible{outline-color:var(--noteink)}
.sticky small{display:block;text-align:right;opacity:.7;min-height:1.4em}
.pn{display:flex;justify-content:space-between;gap:10px}
.pn a{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.k{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--c) 10%,transparent);border-left:4px solid var(--c)}
.k span{font-size:28px;line-height:1}
.k b{display:block}
.k p{margin:2px 0 0;color:var(--mut);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar small{text-align:left!important}
.bar button{background:var(--noteink);color:var(--note);border:0;border-radius:8px;padding:8px 16px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer}
.bar button:focus-visible{outline:3px solid var(--noteink);outline-offset:2px}
#nl{margin-top:14px}
.ni{margin-top:10px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;background:var(--card)}
.nh{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px}
.nh button{background:none;border:0;cursor:pointer;font-size:16px;padding:4px}

function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'>'.replace('>','&gt;')}[c]})}
function KP(i){return P[i-1].map(function(x){return '<div class="k"><span>'+x[0]+'</span><div><b>'+x[1]+'</b><p>'+x[2]+'</p></div></div>'}).join('')}
var $=function(s){return document.querySelector(s)};
var st={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function dia(l){
 var n=l.d.length,c=l.c,s='',ln='',nd='';
 if(l.t==='flow'){
  var g=720/n;
  l.d.forEach(function(x,i){var cx=g*i+g/2;
   if(i)s+='<path d="M'+(cx-g+46)+' 80H'+(cx-48)+'" stroke="'+c+'" stroke-width="3" marker-end="url(#a)"/>';
   s+='<circle cx="'+cx+'" cy="80" r="40" fill="'+c+'" fill-opacity=".16" stroke="'+c+'" stroke-width="2.5"/><text x="'+cx+'" y="92" font-size="36" text-anchor="middle">'+x[0]+'</text><text x="'+cx+'" y="148" font-size="16" font-weight="600" text-anchor="middle">'+x[1]+'</text>';
  });
  return '<svg class="dia" viewBox="0 0 720 175" role="img" aria-label="Sơ đồ bài học"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="'+c+'"/></marker></defs>'+s+'</svg>';
 }
 l.d.forEach(function(x,i){
  var a=-Math.PI/2+i*2*Math.PI/n,px=360+Math.cos(a)*260,py=150+Math.sin(a)*100;
  ln+='<line x1="360" y1="150" x2="'+px+'" y2="'+py+'" stroke="'+c+'" stroke-width="2.5" stroke-dasharray="6 5"/>';
  nd+='<circle cx="'+px+'" cy="'+py+'" r="32" fill="var(--card)" stroke="'+c+'" stroke-width="2.5"/><text x="'+px+'" y="'+(py+10)+'" font-size="28" text-anchor="middle">'+x[0]+'</text><text x="'+px+'" y="'+(py+54)+'" font-size="15" font-weight="600" text-anchor="middle">'+x[1]+'</text>';
 });
 return '<svg class="dia" viewBox="0 0 720 320" role="img" aria-label="Sơ đồ bài học">'+ln+'<circle cx="360" cy="150" r="52" fill="'+c+'"/><text x="360" y="150" font-size="34" text-anchor="middle" style="fill:#fff">'+l.i+'</text><text x="360" y="182" font-size="14" font-weight="800" text-anchor="middle" style="fill:#fff">'+l.m+'</text>'+nd+'</svg>';
}
function nav(cur){

 L.forEach(function(l,i){h+='<a href="#bai-'+(i+1)+'" title="Bài '+(i+1)+'" aria-label="Bài '+(i+1)+'" style="--c:'+l.c+'" class="'+(cur===i+1?'on':'')+'">'+(i+1)+'</a>'});
 $('#nav').innerHTML=h;
}
function home(){
 document.title='Thư viện số cá nhân – Nguyễn Trường Vũ';
 $('#app').innerHTML='<div class="grid">'+L.map(function(l,i){return '<a class="card" style="--c:'+l.c+'" href="#bai-'+(i+1)+'"><span class="e">'+l.e+'</span><b>Bài '+(i+1)+'</b><span class="t">'+l.n+'</span></a>'}).join('')+'</div>';
}
function lesson(i){
 var l=L[i-1],key='notes-bai-'+i,ns;try{ns=JSON.parse(st.get(key))}catch(e){ns=null}if(!Array.isArray(ns))ns=[{t:'Ghi chú mẫu',x:l.k}];

 var links=l.l.map(function(x){return '<a href="'+x[1]+'" target="_blank" rel="noopener noreferrer"><span style="font-size:26px">🔗</span><span><b>'+x[0]+'</b><small>'+x[1]+'</small></span></a>'}).join('');
 var pv=i>1?'<a href="#bai-'+(i-1)+'">‹ Bài '+(i-1)+'</a>':'<span></span>',nx=i<8?'<a href="#bai-'+(i+1)+'">Bài '+(i+1)+' ›</a>':'<span></span>';
 $('#app').innerHTML='<div style="--c:'+l.c+'"><div class="hd"><span class="big">'+l.e+'</span><div><p>Bài '+i+' / 8</p><h2>Bài '+i+'. '+l.n+'</h2></div></div>'
 +'<section class="sec"><h3><b>★</b>Kiến thức trọng tâm</h3><div class="kp">'+KP(i)+'</div></section><section class="sec"><h3><b>a</b>Tệp tin</h3><div class="file"><span class="ic">📄</span><div><div class="fn">'+l.f+'</div><span class="badge">PPTX</span></div></div></section>'
 +'<section class="sec"><h3><b>b</b>Hình ảnh / Video</h3>'+dia(l)+'<h3 class="content-title">Nội dung</h3><a class="yt-card" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query='+encodeURIComponent(l.yt)+'" aria-label="Xem video minh họa bài '+i+' trên YouTube"><span class="yt-play">▶</span><span class="yt-copy"><span class="yt-kicker">▶ YouTube · Video học tập</span><strong>Xem video minh họa bài '+i+'</strong><small>'+l.yt+' · Nhấn để mở danh sách video liên quan trên YouTube</small><span class="yt-action">XEM TRÊN YOUTUBE <span aria-hidden="true">↗</span></span></span></a></section>'
 +'<section class="sec"><h3><b>c</b>Link tham chiếu</h3><div class="links">'+links+'</div></section>'
 +'<section class="sec"><h3><b>d</b>Ghi chú của bản thân</h3><div class="sticky"><textarea id="nt" placeholder="Vừa học xong? Viết ghi chú của bạn tại đây..." aria-label="Ghi chú mới bài '+i+'"></textarea><div class="bar"><small id="sv"></small><button type="button" id="sb">Lưu ghi chú</button></div></div><div id="nl"></div></section>'
 +'<div class="pn">'+pv+nx+'</div></div>';
 function draw(){$('#nl').innerHTML=ns.length?ns.map(function(n,j){return '<article class="ni"><div class="nh"><span>'+esc(n.t)+'</span><button type="button" data-j="'+j+'" aria-label="Xóa ghi chú">🗑️</button></div><p>'+esc(n.x)+'</p></article>'}).join(''):'<p class="em">Chưa có ghi chú nào. Hãy viết ghi chú đầu tiên của bạn.</p>'}
 function save(){var v=$('#nt').value.trim();if(!v){$('#sv').textContent='Hãy nhập nội dung trước khi lưu';return}ns.unshift({t:new Date().toLocaleString('vi-VN'),x:v});st.set(key,JSON.stringify(ns));$('#nt').value='';$('#sv').textContent='Đã lưu ghi chú';draw()}
 $('#sb').addEventListener('click',save);$('#nt').addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='Enter')save()});
 $('#nl').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;ns.splice(+b.dataset.j,1);st.set(key,JSON.stringify(ns));draw()});draw();
}
function route(){
 var m=/^bai-([1-8])$/.exec(location.hash.slice(1)),i=m?+m[1]:0;

}
